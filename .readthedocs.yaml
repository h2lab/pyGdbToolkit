version: 2

build:
  os: ubuntu-24.04
  apt_packages:
    - libasound2t64
  tools:
    python: "3.12"
    nodejs: "22"
  jobs:
    post_install:
      - npm install --global @mermaid-js/mermaid-cli@11
    build:
      html:
        - python -m sphinx -b html -n -W --keep-going -D mermaid_params="--backgroundColor,white,--width,1200,--puppeteerConfigFile,doc/puppeteer-readthedocs.json" doc "$READTHEDOCS_OUTPUT/html"

sphinx:
  configuration: doc/conf.py
  builder: html
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev
