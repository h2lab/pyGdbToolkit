[build-system]
requires = ["setuptools>=80", "setuptools_scm>=9"]
build-backend = "setuptools.build_meta"

[project]
name = "pyGdbToolkit"
description = "A complete toolkit for gdb-based audit and debugging"
dynamic = ["version"]
requires-python = ">= 3.12"
readme = "README.md"
authors = [
  {name = "Florent Valette"},
  {name = "Philippe Thierry"},
]
license = {file = "LICENSES/Apache-2.0.txt"}
dependencies = [
    "requests>=2.32",
    "rich>=13.6",
    "textual>=1.0",
    "websockets>=14.2",
]
classifiers = [
    "Development Status :: 4 - Beta",

    "Intended Audience :: Developers",

    "Topic :: Software Development :: Debuggers",

    "License :: OSI Approved :: Apache Software License",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/h2lab"
# Documentation = TODO
Repository = "https://github.com/h2lab/pyGdbToolkit"
Issues = "https://github.com/h2lab/pyGdbToolkit/issues"

[project.scripts]
pyGdbServer = "pyGdbServer.cli:main"
pyGdbClient = "pyGdbClient.cli:main"
pyTestFarm = "pyTestFarm.cli:main"

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "flake8-docstrings",
    "mypy",
    "pytest",
    "pytest-cov",
    "types-gdb",
    "sphinx>=8,<9",
    "myst-parser>=4,<5",
    "furo>=2024.8.6,<2027",
]

[tool.setuptools_scm]

[tool.black]
line-length = 100
diff = true
check = true
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
relative_files = true
source = ["pyGdbToolkit"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
