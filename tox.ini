[tox]
envlist = py312, lint, typecheck, docs
isolated_build = True

[testenv]
deps =
    pytest
    pytest-cov
commands =
    pytest --cov=pyGdbToolkit --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml {posargs}

[testenv:lint]
deps =
    black
    flake8
    flake8-docstrings
commands =
    black --check src
    flake8 src

[testenv:typecheck]
extras = dev
deps =
    mypy
commands =
    mypy src

[testenv:docs]
description = Build the offline HTML user guide in both layouts
extras = dev
deps =
passenv =
    PUPPETEER_EXECUTABLE_PATH
commands =
    python {toxinidir}/doc/render_diagrams.py
    python -m sphinx -b html -n -W --keep-going {toxinidir}/doc {toxinidir}/doc/_build/html
    python -m sphinx -b singlehtml -n -W --keep-going {toxinidir}/doc {toxinidir}/doc/_build/singlehtml

[testenv:docs-pdf]
description = Build the PDF user guide (requires Mermaid CLI and TeX)
extras = {[testenv:docs]extras}
deps =
passenv = {[testenv:docs]passenv}
commands =
    python {toxinidir}/doc/render_diagrams.py
    python -m sphinx -M latexpdf {toxinidir}/doc {toxinidir}/doc/_build -n -W --keep-going
